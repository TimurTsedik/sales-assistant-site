<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Assistant</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1c1e; --muted: #5b6167; --rule: #e2e5e9; --accent: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --fg: #e6e8ea; --muted: #a0a7ae; --rule: #2a2e34; --accent: #6ea8fe; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; min-height: 100vh; align-items: center; justify-content: center;
  }
  .wrap { max-width: 32rem; padding: 2rem 1.25rem; }
  h1 { font-size: 2rem; margin: 0 0 .75rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  nav a { color: var(--accent); margin-right: 1.25rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sales Assistant</h1>
  <p>A personal assistant for working with clients. Everything you keep in the app stays
  on your phone.</p>
  <nav>
    <a href="/privacy">Privacy Policy</a>
    <a href="mailto:support@sales-assistant.app">support@sales-assistant.app</a>
  </nav>
</div>
</body>
</html>
